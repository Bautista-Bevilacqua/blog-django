<div class="col">
    <div class="card h-100 shadow-sm">
        {% if post.image %}
            <img src="{{ post.image.url }}" class="card-img-top post-card-img" alt="{{ post.title }}">
        {% else %}
            <div class="card-img-top post-img-placeholder">Sin imagen</div>
        {% endif %}
        <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ post.title }}</h5>
            {% if post.subtitle %}<h6 class="card-subtitle mb-2 text-muted">{{ post.subtitle }}</h6>{% endif %}
            <p class="card-text">{{ post.content|truncatewords:25 }}</p>
            <a href="{{ post.get_absolute_url }}" class="btn btn-primary btn-sm mt-auto align-self-start">Leer más</a>
        </div>
        <div class="card-footer text-muted small">
            Por {{ post.author.username }} &middot; {{ post.created_at|date:"d/m/Y" }}
        </div>
    </div>
</div>
