{% extends 'posts/base.html' %}

{% block title %}Registrarse · Blog Web{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 520px;">
    <h1 class="h3 mb-4">Crear cuenta</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'accounts/_campos_form.html' %}
        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
    </form>
    <p class="mt-3 text-center">¿Ya tenés cuenta? <a href="{% url 'accounts:login' %}">Iniciá sesión</a></p>
</div>
{% endblock %}
